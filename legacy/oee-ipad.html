  <!-- calculations.js -->
  <script>
/* =========================================================================
 * calculations.js
 * Responsabilidade: todas as regras de cálculo de indicadores.
 * Este módulo é puro: recebe eventos e devolve números. Não conhece DOM,
 * LocalStorage nem gráficos — o que permite reaproveitá-lo no futuro em um
 * backend Node/Edge sem alteração.
 *
 * Fórmulas (TPM clássico):
 *   Tempo de Produção Planejado = Tempo Total do Turno − Paradas Planejadas
 *   Tempo Operacional           = TPP − Paradas Não Planejadas
 *   Disponibilidade             = Tempo Operacional ÷ TPP
 *   Performance                 = (Produção Total × Ciclo Ideal) ÷ Tempo Operacional
 *   Qualidade                   = Produção Aprovada ÷ Produção Total
 *   OEE                         = Disponibilidade × Performance × Qualidade
 *   Produção Aprovada           = Produção Total − Refugos
 * ========================================================================= */
(function (global) {
  'use strict';

  var OEE = (global.OEE = global.OEE || {});
  var Model = OEE.Model;

  /* ---------------------------------------------------------------------
   * Utilidades numéricas e de formatação
   * ------------------------------------------------------------------- */

  function seguro(n) { return (typeof n === 'number' && isFinite(n)) ? n : 0; }

  /* Divisão protegida: sem tempo/quantidade base, o indicador é indefinido
     (devolve null) em vez de 0 — o que evita "OEE 0%" falso em máquina sem
     tempo planejado. */
  function dividir(a, b) {
    if (!b || b <= 0) return null;
    return a / b;
  }

  /* Interseção entre o segmento [ini,fim] e a janela [janIni,janFim]. */
  function sobreposicaoMs(ini, fim, janIni, janFim) {
    var f = (fim === null || fim === undefined) ? janFim : fim;
    var a = Math.max(ini, janIni);
    var b = Math.min(f, janFim);
    return b > a ? b - a : 0;
  }

  function classeDoEstado(estadoId, config) {
    var override = config && config.classificacaoEstados && config.classificacaoEstados[estadoId];
    if (override) return override;
    var def = Model.ESTADOS[estadoId];
    return def ? def.classe : 'NAO_PLANEJADA';
  }

  function formatarPercentual(valor, casas) {
    if (valor === null || valor === undefined) return '—';
    var c = (casas === undefined) ? 1 : casas;
    return (valor * 100).toFixed(c).replace('.', ',') + '%';
  }

  function formatarNumero(valor, casas) {
    if (valor === null || valor === undefined) return '—';
    var c = (casas === undefined) ? 0 : casas;
    return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
  }

  /* Duração legível: 1h 24min / 8min 30s */
  function formatarDuracao(segundos) {
    if (segundos === null || segundos === undefined || !isFinite(segundos)) return '—';
    var s = Math.max(0, Math.round(segundos));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'min';
    if (m > 0) return m + 'min ' + String(r).padStart(2, '0') + 's';
    return r + 's';
  }

  /* Cronômetro do estado atual: HH:MM:SS */
  function formatarCronometro(segundos) {
    var s = Math.max(0, Math.round(segundos || 0));
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function formatarHora(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function formatarDataHora(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return d.toLocaleDateString('pt-BR') + ' ' + formatarHora(ts);
  }

  /* ---------------------------------------------------------------------
   * Agregação de tempos por classe de estado
   * ------------------------------------------------------------------- */

  /**
   * Soma a duração dos eventos de estado dentro da janela informada.
   * Eventos abertos (fim === null) são contados até o fim da janela.
   *
   * @returns {Object} tempos em segundos, por estado e por classe.
   */
  function agregarTempos(eventosEstado, janIni, janFim, config) {
    var porEstado = {};
    var porClasse = { PRODUTIVO: 0, PLANEJADA: 0, NAO_PLANEJADA: 0 };
    var totalCoberto = 0;

    eventosEstado.forEach(function (ev) {
      var ms = sobreposicaoMs(ev.inicio, ev.fim, janIni, janFim);
      if (ms <= 0) return;
      var seg = ms / 1000;
      porEstado[ev.estado] = (porEstado[ev.estado] || 0) + seg;
      porClasse[classeDoEstado(ev.estado, config)] += seg;
      totalCoberto += seg;
    });

    return { porEstado: porEstado, porClasse: porClasse, totalCobertoSeg: totalCoberto };
  }

  /* ---------------------------------------------------------------------
   * Cálculo principal de OEE
   * ------------------------------------------------------------------- */

  /**
   * @param {Object} p
   *   p.eventosEstado   {Array}  eventos de estado da(s) máquina(s)
   *   p.eventosProducao {Array}  apontamentos de produção
   *   p.inicio, p.fim   {Number} janela de análise (ms)
   *   p.cicloIdealSeg   {Number} ciclo ideal médio (s/peça)
   *   p.config          {Object} configurações (classificação de estados)
   *
   * @returns {Object} indicadores + memória de cálculo + anomalias.
   */
  function calcularOEE(p) {
    var config = p.config || {};
    var janIni = p.inicio;
    var janFim = p.fim;
    var anomalias = [];

    var tempos = agregarTempos(p.eventosEstado || [], janIni, janFim, config);

    /* Tempo total considerado: apenas o período em que existe registro de
       estado para a máquina. Períodos sem registro não são atribuídos como
       perda — evita penalizar máquina recém-cadastrada. */
    var tempoTotalSeg = tempos.totalCobertoSeg;
    var paradaPlanejadaSeg = tempos.porClasse.PLANEJADA;
    var paradaNaoPlanejadaSeg = tempos.porClasse.NAO_PLANEJADA;

    /* TPP = tempo total − paradas planejadas */
    var tempoProducaoPlanejadoSeg = Math.max(0, tempoTotalSeg - paradaPlanejadaSeg);
    /* Tempo operacional = TPP − paradas não planejadas */
    var tempoOperacionalSeg = Math.max(0, tempoProducaoPlanejadoSeg - paradaNaoPlanejadaSeg);

    /* Produção no período */
    var producaoTotal = 0, refugo = 0, retrabalho = 0;
    (p.eventosProducao || []).forEach(function (ev) {
      if (ev.ts < janIni || ev.ts > janFim) return;
      producaoTotal += seguro(ev.qtdTotal);
      refugo += seguro(ev.qtdRefugo);
      retrabalho += seguro(ev.qtdRetrabalho);
    });
    var producaoAprovada = Math.max(0, producaoTotal - refugo);

    var cicloIdealSeg = p.cicloIdealSeg || 0;

    /* Indicadores */
    var disponibilidade = dividir(tempoOperacionalSeg, tempoProducaoPlanejadoSeg);
    var performance = dividir(producaoTotal * cicloIdealSeg, tempoOperacionalSeg);
    var qualidade = dividir(producaoAprovada, producaoTotal);

    /* Ciclo real médio observado. */
    var cicloRealSeg = dividir(tempoOperacionalSeg, producaoTotal);

    /* Validação: indicadores acima de 100% indicam inconsistência de
       apontamento (ciclo ideal errado, produção lançada em excesso ou
       parada não registrada). Registramos a anomalia e limitamos o valor
       usado no OEE, preservando o valor bruto para auditoria. */
    var performanceBruta = performance;
    if (performance !== null && performance > 1) {
      anomalias.push({
        indicador: 'Performance',
        valorBruto: performance,
        mensagem: 'Performance acima de 100%: revise o ciclo ideal, o apontamento de produção ou paradas não registradas.'
      });
      performance = 1;
    }
    var disponibilidadeBruta = disponibilidade;
    if (disponibilidade !== null && disponibilidade > 1) {
      anomalias.push({
        indicador: 'Disponibilidade',
        valorBruto: disponibilidade,
        mensagem: 'Disponibilidade acima de 100%: há sobreposição de eventos de estado no período.'
      });
      disponibilidade = 1;
    }
    if (qualidade !== null && qualidade > 1) qualidade = 1;

    var oee = (disponibilidade === null || performance === null || qualidade === null)
      ? null
      : disponibilidade * performance * qualidade;

    /* MTBF / MTTR considerando apenas paradas não planejadas. */
    var falhas = (p.eventosParada || []).filter(function (ev) {
      return !ev.planejada && sobreposicaoMs(ev.inicio, ev.fim, janIni, janFim) > 0;
    });
    var tempoFalhasSeg = falhas.reduce(function (acc, ev) {
      return acc + sobreposicaoMs(ev.inicio, ev.fim, janIni, janFim) / 1000;
    }, 0);
    var mtbfSeg = falhas.length ? tempoOperacionalSeg / falhas.length : null;
    var mttrSeg = falhas.length ? tempoFalhasSeg / falhas.length : null;

    return {
      janela: { inicio: janIni, fim: janFim },
      tempoTotalSeg: tempoTotalSeg,
      paradaPlanejadaSeg: paradaPlanejadaSeg,
      paradaNaoPlanejadaSeg: paradaNaoPlanejadaSeg,
      tempoProducaoPlanejadoSeg: tempoProducaoPlanejadoSeg,
      tempoOperacionalSeg: tempoOperacionalSeg,
      temposPorEstado: tempos.porEstado,
      producaoTotal: producaoTotal,
      producaoAprovada: producaoAprovada,
      refugo: refugo,
      retrabalho: retrabalho,
      cicloIdealSeg: cicloIdealSeg,
      cicloRealSeg: cicloRealSeg,
      disponibilidade: disponibilidade,
      performance: performance,
      qualidade: qualidade,
      oee: oee,
      disponibilidadeBruta: disponibilidadeBruta,
      performanceBruta: performanceBruta,
      qtdParadas: falhas.length,
      tempoFalhasSeg: tempoFalhasSeg,
      mtbfSeg: mtbfSeg,
      mttrSeg: mttrSeg,
      anomalias: anomalias
    };
  }

  /* ---------------------------------------------------------------------
   * Agrupamentos usados nos dashboards
   * ------------------------------------------------------------------- */

  /**
   * Calcula OEE para cada grupo (máquina, linha, turno, produto...).
   * @param chaveFn recebe a máquina e devolve a chave do grupo.
   */
  function oeePorGrupo(dataset, maquinas, janIni, janFim, chaveFn, rotuloFn) {
    var grupos = {};

    maquinas.forEach(function (maq) {
      var chave = chaveFn(maq);
      if (chave === null || chave === undefined) return;
      if (!grupos[chave]) {
        grupos[chave] = { chave: chave, rotulo: rotuloFn ? rotuloFn(chave, maq) : String(chave), maquinas: [] };
      }
      grupos[chave].maquinas.push(maq);
    });

    return Object.keys(grupos).map(function (k) {
      var g = grupos[k];
      var ids = g.maquinas.map(function (m) { return m.id; });
      var res = calcularOEE({
        eventosEstado: dataset.eventosEstado.filter(function (e) { return ids.indexOf(e.maquinaId) >= 0; }),
        eventosProducao: dataset.eventosProducao.filter(function (e) { return ids.indexOf(e.maquinaId) >= 0; }),
        eventosParada: dataset.eventosParada.filter(function (e) { return ids.indexOf(e.maquinaId) >= 0; }),
        inicio: janIni,
        fim: janFim,
        cicloIdealSeg: cicloIdealMedio(dataset, ids, janIni, janFim),
        config: dataset.config
      });
      return { chave: g.chave, rotulo: g.rotulo, maquinas: g.maquinas, indicadores: res };
    });
  }

  /**
   * Ciclo ideal médio ponderado pela quantidade produzida de cada produto.
   * Necessário quando o grupo mistura produtos com ciclos diferentes.
   */
  function cicloIdealMedio(dataset, maquinaIds, janIni, janFim) {
    var somaPeso = 0, somaCiclo = 0;
    dataset.eventosProducao.forEach(function (ev) {
      if (maquinaIds.indexOf(ev.maquinaId) < 0) return;
      if (ev.ts < janIni || ev.ts > janFim) return;
      var ordem = dataset.ordens.filter(function (o) { return o.id === ev.ordemId; })[0];
      var ciclo = ordem ? ordem.cicloIdealSeg : null;
      if (!ciclo) {
        var prod = dataset.produtos.filter(function (p) { return p.id === ev.produtoId; })[0];
        ciclo = prod ? prod.cicloIdealSeg : 0;
      }
      somaCiclo += ciclo * ev.qtdTotal;
      somaPeso += ev.qtdTotal;
    });
    if (somaPeso > 0) return somaCiclo / somaPeso;

    /* Sem produção no período: usa o ciclo ideal cadastrado nas máquinas. */
    var maquinas = dataset.maquinas.filter(function (m) { return maquinaIds.indexOf(m.id) >= 0; });
    if (!maquinas.length) return 0;
    return maquinas.reduce(function (a, m) { return a + (m.cicloIdealSeg || 0); }, 0) / maquinas.length;
  }

  /* Pareto de paradas: agrupa por motivo ou categoria e ordena por tempo. */
  function pareto(eventosParada, janIni, janFim, campo, rotuloFn) {
    var mapa = {};
    eventosParada.forEach(function (ev) {
      var ms = sobreposicaoMs(ev.inicio, ev.fim, janIni, janFim);
      if (ms <= 0) return;
      var chave = ev[campo] || 'Outros';
      if (!mapa[chave]) mapa[chave] = { chave: chave, rotulo: rotuloFn ? rotuloFn(chave) : String(chave), tempoSeg: 0, ocorrencias: 0 };
      mapa[chave].tempoSeg += ms / 1000;
      mapa[chave].ocorrencias += 1;
    });

    var lista = Object.keys(mapa).map(function (k) { return mapa[k]; })
      .sort(function (a, b) { return b.tempoSeg - a.tempoSeg; });

    var total = lista.reduce(function (a, i) { return a + i.tempoSeg; }, 0);
    var acumulado = 0;
    lista.forEach(function (i) {
      i.participacao = total ? i.tempoSeg / total : 0;
      acumulado += i.participacao;
      i.acumulado = acumulado;
    });
    return { itens: lista, totalSeg: total };
  }

  /* Série temporal de OEE em buckets (hora ou dia). */
  function serieOEE(dataset, maquinaIds, janIni, janFim, bucketMs) {
    var pontos = [];
    var estados = dataset.eventosEstado.filter(function (e) { return maquinaIds.indexOf(e.maquinaId) >= 0; });
    var producao = dataset.eventosProducao.filter(function (e) { return maquinaIds.indexOf(e.maquinaId) >= 0; });
    var paradas = dataset.eventosParada.filter(function (e) { return maquinaIds.indexOf(e.maquinaId) >= 0; });

    for (var t = janIni; t < janFim; t += bucketMs) {
      var fimBucket = Math.min(t + bucketMs, janFim);
      var res = calcularOEE({
        eventosEstado: estados, eventosProducao: producao, eventosParada: paradas,
        inicio: t, fim: fimBucket,
        cicloIdealSeg: cicloIdealMedio(dataset, maquinaIds, t, fimBucket),
        config: dataset.config
      });
      pontos.push({ inicio: t, fim: fimBucket, indicadores: res });
    }
    return pontos;
  }

  /* Produção agregada por bucket de tempo (usada em "produção por hora"). */
  function producaoPorBucket(eventosProducao, janIni, janFim, bucketMs) {
    var buckets = [];
    for (var t = janIni; t < janFim; t += bucketMs) {
      buckets.push({ inicio: t, fim: Math.min(t + bucketMs, janFim), total: 0, aprovada: 0, refugo: 0 });
    }
    eventosProducao.forEach(function (ev) {
      if (ev.ts < janIni || ev.ts > janFim) return;
      var idx = Math.floor((ev.ts - janIni) / bucketMs);
      if (idx < 0 || idx >= buckets.length) return;
      buckets[idx].total += seguro(ev.qtdTotal);
      buckets[idx].refugo += seguro(ev.qtdRefugo);
      buckets[idx].aprovada += seguro(ev.qtdTotal) - seguro(ev.qtdRefugo);
    });
    return buckets;
  }

  /* Classificação simples para semáforo de OEE. */
  function faixaOEE(valor, meta) {
    if (valor === null || valor === undefined) return 'indefinido';
    var m = meta || 0.75;
    if (valor >= m) return 'bom';

  OEE.Calc = {
    calcularOEE: calcularOEE,
    agregarTempos: agregarTempos,
    oeePorGrupo: oeePorGrupo,
    cicloIdealMedio: cicloIdealMedio,
    pareto: pareto,
    serieOEE: serieOEE,
    producaoPorBucket: producaoPorBucket,
    sobreposicaoMs: sobreposicaoMs,
    classeDoEstado: classeDoEstado,
    faixaOEE: faixaOEE,
    dividir: dividir,
    fmt: {
      percentual: formatarPercentual,
      numero: formatarNumero,
      duracao: formatarDuracao,
      cronometro: formatarCronometro,
      hora: formatarHora,
      dataHora: formatarDataHora
    }
  };
})(window);

  <script>
/* =========================================================================
 * storage.js
 * Responsabilidade: persistência e acesso aos dados.
 *
 * O restante da aplicação nunca fala com o LocalStorage diretamente: ele
 * usa a interface OEE.DataSource. Trocar a origem dos dados (REST, MQTT,
 * OPC UA, InfluxDB, historiador) significa fornecer outro objeto com os
 * mesmos métodos e registrá-lo em OEE.DataSource.usar(fonte).
 *
 * Contrato da interface:
 *   carregar()            -> Promise<dataset>
 *   salvar(dataset)       -> Promise<void>
 *   restaurarDemo()       -> Promise<dataset>
 *   disponivel()          -> boolean
 * ========================================================================= */
(function (global) {
  'use strict';

  var OEE = (global.OEE = global.OEE || {});

  var CHAVE_DATASET = 'oee.mvp.v1.dataset';
  var CHAVE_PREFERENCIAS = 'oee.mvp.v1.preferencias';

  /* ---------------------------------------------------------------------
   * Camada de LocalStorage tolerante a falhas.
   * Abrir index.html via file:// pode bloquear o LocalStorage em alguns
   * navegadores; nesse caso caímos para um armazenamento em memória e
   * avisamos a interface.
   * ------------------------------------------------------------------- */
  var memoria = {};
  var localDisponivel = (function () {
    try {
      var teste = '__oee_teste__';
      global.localStorage.setItem(teste, '1');
      global.localStorage.removeItem(teste);
      return true;
    } catch (e) {
      return false;
    }
  })();

  function ler(chave) {
    try {
      return localDisponivel ? global.localStorage.getItem(chave) : (memoria[chave] || null);
    } catch (e) {
      return memoria[chave] || null;
    }
  }

  function escrever(chave, valor) {
    try {
      if (localDisponivel) global.localStorage.setItem(chave, valor);
      else memoria[chave] = valor;
      return true;
    } catch (e) {
      /* Cota excedida ou acesso negado: mantém em memória para não perder
         a sessão do operador. */
      memoria[chave] = valor;
      return false;
    }
  }

  function remover(chave) {
    try { if (localDisponivel) global.localStorage.removeItem(chave); } catch (e) { /* ignora */ }
    delete memoria[chave];
  }

  /* ---------------------------------------------------------------------
   * Validação mínima do dataset
   * ------------------------------------------------------------------- */
  var COLECOES = [
    'plantas', 'areas', 'linhas', 'maquinas', 'produtos', 'turnos',
    'operadores', 'motivos', 'ordens', 'eventosEstado', 'eventosProducao',
    'eventosParada', 'observacoes'
  ];

  function validarDataset(ds) {
    var erros = [];
    if (!ds || typeof ds !== 'object') { erros.push('Arquivo não contém um objeto de dados.'); return erros; }
    COLECOES.forEach(function (c) {
      if (!Array.isArray(ds[c])) erros.push('Coleção ausente ou inválida: ' + c + '.');
    });
    if (!ds.empresa) erros.push('Empresa não informada.');
    if (!ds.config) erros.push('Bloco de configuração ausente.');
    return erros;
  }

  /* Preenche coleções ausentes para manter compatibilidade entre versões. */
  function normalizar(ds) {
    COLECOES.forEach(function (c) { if (!Array.isArray(ds[c])) ds[c] = []; });
    /* Fora de COLECOES de propósito: arquivos exportados antes da trilha
       existir continuam válidos, apenas entram com a trilha vazia. */
    if (!Array.isArray(ds.auditoria)) ds.auditoria = [];
    ds.config = ds.config || {};
    if (ds.config.metaOEE === undefined) ds.config.metaOEE = 0.75;
    if (ds.config.metaSetupMin === undefined) ds.config.metaSetupMin = 20;
    if (ds.config.metaRefugoPct === undefined) ds.config.metaRefugoPct = 0.02;
    if (ds.config.limiteMicroparadaSeg === undefined) ds.config.limiteMicroparadaSeg = 300;
    if (ds.config.intervaloSimulacaoSeg === undefined) ds.config.intervaloSimulacaoSeg = 5;
    if (ds.config.simulacaoAtiva === undefined) ds.config.simulacaoAtiva = false;
    if (ds.config.auditarSimulacao === undefined) ds.config.auditarSimulacao = true;
    if (ds.config.acmpAtivo === undefined) ds.config.acmpAtivo = true;
    ds.meta = ds.meta || { versao: 1 };
    return ds;
  }

  /* ---------------------------------------------------------------------
   * Implementação LocalStorage da interface DataSource
   * ------------------------------------------------------------------- */
  var LocalStorageSource = {
    nome: 'LocalStorage',

    disponivel: function () { return true; },

    avisoPersistencia: function () {
      if (localDisponivel) return null;
      return ehIOS()
        ? 'O Safari bloqueou o armazenamento local neste contexto. A aplicação funciona normalmente, mas os dados ficam só na memória e se perdem ao fechar a aba. Para conservar o histórico, use Configurações › Exportar JSON e salve em Arquivos, ou abra a aplicação por HTTP.'
        : 'O navegador bloqueou o armazenamento local neste contexto. Os dados desta sessão ficam apenas na memória e serão perdidos ao fechar a aba. Sirva a pasta por HTTP para persistir.';
    },

    carregar: function () {
      return new Promise(function (resolve) {
        var bruto = ler(CHAVE_DATASET);
        if (!bruto) { resolve(null); return; }
        try {
          resolve(normalizar(JSON.parse(bruto)));
        } catch (e) {
          console.error('Dataset corrompido no armazenamento local. Gerando novo conjunto.', e);
          remover(CHAVE_DATASET);
          resolve(null);
        }
      });
    },

    salvar: function (dataset) {
      return new Promise(function (resolve, reject) {
        try {
          var ok = escrever(CHAVE_DATASET, JSON.stringify(dataset));
          if (!ok) console.warn('Gravação feita apenas em memória.');
          resolve();
        } catch (e) {
          reject(e);
        }
      });
    },

    restaurarDemo: function (opcoes) {
      var ds = OEE.Data.gerarDemo(opcoes || {});
      var self = this;
      return self.salvar(ds).then(function () { return ds; });
    },

    limpar: function () {
      remover(CHAVE_DATASET);
      return Promise.resolve();
    }
  };

  /* ---------------------------------------------------------------------
   * Exemplo (não ativo) de fonte remota — mostra o ponto de extensão.
   * Para usar no futuro: OEE.DataSource.usar(OEE.Storage.criarRestSource('/api'))
   * ------------------------------------------------------------------- */
  function criarRestSource(baseUrl) {
    return {
      nome: 'REST',
      disponivel: function () { return typeof fetch === 'function'; },
      avisoPersistencia: function () { return null; },
      carregar: function () {
        return fetch(baseUrl + '/dataset').then(function (r) { return r.json(); }).then(normalizar);
      },
      salvar: function (dataset) {
        return fetch(baseUrl + '/dataset', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dataset)
        }).then(function () { return undefined; });
      },
      restaurarDemo: function () {
        return fetch(baseUrl + '/dataset/demo', { method: 'POST' })
          .then(function (r) { return r.json(); }).then(normalizar);
      }
    };
  }

  /* ---------------------------------------------------------------------
   * Fachada usada pela aplicação
   * ------------------------------------------------------------------- */
  var fonteAtual = LocalStorageSource;

  var DataSource = {
    usar: function (fonte) { fonteAtual = fonte; },
    atual: function () { return fonteAtual; },
    carregar: function () { return fonteAtual.carregar(); },
    salvar: function (ds) { return fonteAtual.salvar(ds); },
    restaurarDemo: function (o) { return fonteAtual.restaurarDemo(o); },
    aviso: function () { return fonteAtual.avisoPersistencia ? fonteAtual.avisoPersistencia() : null; }
  };

  /* ---------------------------------------------------------------------
   * Preferências de interface (modo, máquina selecionada, filtros)
   * ------------------------------------------------------------------- */
  function lerPreferencias() {
    try { return JSON.parse(ler(CHAVE_PREFERENCIAS) || '{}'); } catch (e) { return {}; }
  }
  function salvarPreferencias(prefs) { escrever(CHAVE_PREFERENCIAS, JSON.stringify(prefs)); }

  /* ---------------------------------------------------------------------
   * Exportação / importação
   * ------------------------------------------------------------------- */
  /* No iPad o atributo `download` é ignorado quando a página vem de file://:
   * o Safari abre o conteúdo numa aba em vez de salvar. A folha de
   * compartilhamento do próprio sistema resolve — ela oferece "Salvar em
   * Arquivos", e-mail, AirDrop — então tentamos por ela primeiro quando o
   * dispositivo souber compartilhar arquivos. O caminho clássico continua
   * valendo em desktop e Android. */
  function baixarArquivo(nome, conteudo, tipo) {
    var mime = tipo + ';charset=utf-8;';

    if (typeof File === 'function' && navigator.share && navigator.canShare) {
      try {
        var arquivo = new File([conteudo], nome, { type: tipo });
        if (navigator.canShare({ files: [arquivo] })) {
          navigator.share({ files: [arquivo], title: nome }).catch(function () {
            baixarPorLink(nome, conteudo, mime);
          });
          return;
        }
      } catch (e) { /* segue para o caminho clássico */ }
    }
    baixarPorLink(nome, conteudo, mime);
  }

  function baixarPorLink(nome, conteudo, mime) {
    var blob = new Blob([conteudo], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.rel = 'noopener';
    /* Sem o target o Safari substitui a aplicação pelo arquivo e o operador
     * perde a tela; abrindo em outra aba, ele volta com um toque. */
    if (ehIOS()) a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* iPadOS moderno se identifica como Macintosh; o que o denuncia é ter
   * tela sensível ao toque. */
  function ehIOS() {
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && typeof document !== 'undefined' && 'ontouchend' in document);
  }

  function carimboArquivo() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  }

  function exportarJSON(dataset) {
    baixarArquivo('oee-dados-' + carimboArquivo() + '.json', JSON.stringify(dataset, null, 2), 'application/json');
  }

  /* CSV com separador ponto e vírgula e BOM, para abrir direto no Excel pt-BR. */
  function paraCSV(linhas) {
    return '\ufeff' + linhas.map(function (linha) {
      return linha.map(function (celula) {
        var v = (celula === null || celula === undefined) ? '' : String(celula);
        if (/[";\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
        return v;
      }).join(';');
    }).join('\n');
  }

  function dataISO(ts) { return ts ? new Date(ts).toISOString() : ''; }

  function exportarCSV(dataset, tipo) {
    var linhas = [];
    var nome = 'oee-' + tipo + '-' + carimboArquivo() + '.csv';
    var indexar = function (colecao) {
      var m = {};
      (dataset[colecao] || []).forEach(function (i) { m[i.id] = i; });
      return m;
    };
    var maquinas = indexar('maquinas'), produtos = indexar('produtos'),
        ordens = indexar('ordens'), motivos = indexar('motivos'), operadores = indexar('operadores');

    if (tipo === 'producao') {
      linhas.push(['id', 'dataHora', 'maquina', 'ordem', 'produto', 'turno', 'operador', 'qtdTotal', 'qtdRefugo', 'qtdRetrabalho', 'causaRefugo']);
      dataset.eventosProducao.forEach(function (e) {
        linhas.push([e.id, dataISO(e.ts),
          (maquinas[e.maquinaId] || {}).nome, (ordens[e.ordemId] || {}).codigo,
          (produtos[e.produtoId] || {}).nome, e.turnoId,
          (operadores[e.operadorId] || {}).nome,
          e.qtdTotal, e.qtdRefugo, e.qtdRetrabalho, e.causaRefugo || '']);
      });
    } else if (tipo === 'paradas') {
      linhas.push(['id', 'maquina', 'ordem', 'turno', 'estado', 'categoria', 'motivo', 'planejada', 'inicio', 'fim', 'duracaoSeg', 'comentario']);
      dataset.eventosParada.forEach(function (e) {
        linhas.push([e.id, (maquinas[e.maquinaId] || {}).nome, (ordens[e.ordemId] || {}).codigo, e.turnoId,
          e.estado, e.categoria, (motivos[e.motivoId] || {}).nome, e.planejada ? 'sim' : 'não',
          dataISO(e.inicio), dataISO(e.fim), e.duracaoSeg, e.comentario || '']);
      });
    } else if (tipo === 'estados') {
      linhas.push(['id', 'maquina', 'ordem', 'turno', 'estado', 'inicio', 'fim', 'duracaoSeg']);
      dataset.eventosEstado.forEach(function (e) {
        var fim = e.fim || Date.now();
        linhas.push([e.id, (maquinas[e.maquinaId] || {}).nome, (ordens[e.ordemId] || {}).codigo, e.turnoId,
          e.estado, dataISO(e.inicio), dataISO(e.fim), Math.round((fim - e.inicio) / 1000)]);
      });
    } else if (tipo === 'ordens') {
      linhas.push(['id', 'codigo', 'maquina', 'produto', 'turno', 'metaQtd', 'cicloIdealSeg', 'status', 'inicio', 'fim']);
      dataset.ordens.forEach(function (o) {
        linhas.push([o.id, o.codigo, (maquinas[o.maquinaId] || {}).nome, (produtos[o.produtoId] || {}).nome,
          o.turnoId, o.metaQtd, o.cicloIdealSeg, o.status, dataISO(o.inicio), dataISO(o.fim)]);
      });
    } else if (tipo === 'auditoria') {
      linhas.push(['id', 'dataHora', 'origem', 'categoria', 'acao', 'sensivel', 'usuario',
        'maquina', 'ordem', 'turno', 'objeto', 'objetoId', 'descricao', 'antes', 'depois', 'contexto', 'hash', 'hashAnterior']);
      (dataset.auditoria || []).forEach(function (r) {
        linhas.push([r.id, dataISO(r.ts), r.origem, r.categoria, r.acao, r.sensivel ? 'sim' : 'não', r.usuario,
          (maquinas[r.maquinaId] || {}).nome || '', (ordens[r.ordemId] || {}).codigo || '', r.turnoId || '',
          r.entidade || '', r.entidadeId || '', r.descricao,
          r.antes ? JSON.stringify(r.antes) : '', r.depois ? JSON.stringify(r.depois) : '',
          r.detalhes ? JSON.stringify(r.detalhes) : '', r.hash, r.hashAnterior || '']);
      });
    } else if (tipo === 'oee-maquina') {
      linhas.push(['maquina', 'linha', 'oee', 'disponibilidade', 'performance', 'qualidade', 'producaoTotal', 'refugo', 'tempoOperacionalSeg', 'tempoParadoSeg']);
      var fim = Date.now(), ini = fim - 24 * 3600000;
      dataset.maquinas.forEach(function (m) {
        var r = OEE.Calc.calcularOEE({
          eventosEstado: dataset.eventosEstado.filter(function (e) { return e.maquinaId === m.id; }),
          eventosProducao: dataset.eventosProducao.filter(function (e) { return e.maquinaId === m.id; }),
          eventosParada: dataset.eventosParada.filter(function (e) { return e.maquinaId === m.id; }),
          inicio: ini, fim: fim,
          cicloIdealSeg: OEE.Calc.cicloIdealMedio(dataset, [m.id], ini, fim),
          config: dataset.config
        });
        var linha = (dataset.linhas.filter(function (l) { return l.id === m.linhaId; })[0] || {}).nome;
        linhas.push([m.nome, linha,
          r.oee === null ? '' : (r.oee * 100).toFixed(2),
          r.disponibilidade === null ? '' : (r.disponibilidade * 100).toFixed(2),
          r.performance === null ? '' : (r.performance * 100).toFixed(2),
          r.qualidade === null ? '' : (r.qualidade * 100).toFixed(2),
          r.producaoTotal, r.refugo, Math.round(r.tempoOperacionalSeg),
          Math.round(r.paradaNaoPlanejadaSeg + r.paradaPlanejadaSeg)]);
      });
    }

    baixarArquivo(nome, paraCSV(linhas), 'text/csv');
  }

  /* Lê um arquivo JSON escolhido pelo usuário e devolve o dataset validado. */
  function importarJSON(arquivo) {
    return new Promise(function (resolve, reject) {
      if (!arquivo) { reject(new Error('Nenhum arquivo selecionado.')); return; }
      var leitor = new FileReader();
      leitor.onload = function () {
        try {
          var ds = JSON.parse(leitor.result);
          var erros = validarDataset(ds);
          if (erros.length) { reject(new Error('Arquivo inválido. ' + erros.join(' '))); return; }
          resolve(normalizar(ds));
        } catch (e) {
          reject(new Error('Não foi possível ler o arquivo: ' + e.message));
        }
      };
      leitor.onerror = function () { reject(new Error('Falha na leitura do arquivo.')); };
      leitor.readAsText(arquivo);
    });
  }

  OEE.Storage = {
    LocalStorageSource: LocalStorageSource,
    criarRestSource: criarRestSource,
    lerPreferencias: lerPreferencias,
    salvarPreferencias: salvarPreferencias,
    exportarJSON: exportarJSON,
    exportarCSV: exportarCSV,
    importarJSON: importarJSON,
    validarDataset: validarDataset,
    normalizar: normalizar,
    ehIOS: ehIOS,
    localDisponivel: localDisponivel
  };

  OEE.DataSource = DataSource;
})(window);

  </script>

  <script>
/* =========================================================================
 * audit.js
 * Responsabilidade: trilha de auditoria — registrar quem fez o quê, quando,
 * sobre qual objeto, e com qual valor antes e depois.
 *
 * Por que isso importa numa aplicação de OEE: o indicador é resultado de
 * classificação humana. Quem reclassifica uma parada de "falha mecânica"
 * para "parada planejada" muda a Disponibilidade do turno; quem edita o
 * ciclo ideal de um produto muda a Performance de todo o histórico. Sem
 * trilha, o número existe mas não se sustenta numa discussão.
 *
 * Três princípios adotados aqui:
 *
 *  1. Somente inclusão. Não existe caminho na interface que altere ou apague
 *     um registro de auditoria. Editar um registro operacional gera um novo
 *     registro de auditoria; nunca reescreve o anterior.
 *
 *  2. Antes e depois. Registrar "alterou o motivo" não serve para nada. O
 *     que serve é "motivo: Falha mecânica → Ajuste de processo".
 *
 *  3. Encadeamento. Cada registro carrega o hash do anterior, formando uma
 *     corrente. Remover ou alterar um registro no meio quebra a corrente e a
 *     tela de auditoria denuncia.
 *
 * Limite honesto do item 3: isto é evidência de adulteração, não prevenção.
 * O hash não é criptográfico e a corrente inteira pode ser recalculada por
 * quem tenha acesso ao arquivo. Serve contra edição casual do JSON, não
 * contra um adversário. Trilha inviolável de verdade exige servidor com
 * escrita append-only e assinatura fora do alcance do cliente — está na
 * seção de arquitetura futura do README.
 * ========================================================================= */
(function (global) {
  'use strict';

  var OEE = global.OEE = global.OEE || {};
  var Model = OEE.Model;

  /* Teto de registros mantidos no navegador. O LocalStorage tem poucos
   * megabytes; num sistema real a trilha é imutável e vai para o servidor. */
  var LIMITE = 4000;
  var REMOVER_POR_VEZ = 500;

  var CATEGORIAS = {
    OPERACAO:     { rotulo: 'Operação',      icone: '\u25B6' },
    PRODUCAO:     { rotulo: 'Produção',      icone: '\u25A4' },
    PARADA:       { rotulo: 'Paradas',       icone: '\u23F8' },
    ORDEM:        { rotulo: 'Ordens',        icone: '\u2637' },
    CADASTRO:     { rotulo: 'Cadastros',     icone: '\u270E' },
    CONFIGURACAO: { rotulo: 'Configurações', icone: '\u2692' },
    DADOS:        { rotulo: 'Dados',         icone: '\u2913' },
    SESSAO:       { rotulo: 'Sessão',        icone: '\u25CE' }
  };

  var ORIGENS = {
    OPERADOR:  { rotulo: 'Operador',  descricao: 'Ação disparada na tela de chão de fábrica' },
    GESTAO:    { rotulo: 'Gestão',    descricao: 'Ação disparada nas telas gerenciais' },
    SIMULACAO: { rotulo: 'Simulação', descricao: 'Evento gerado pelo simulador de dados' },
    SISTEMA:   { rotulo: 'Sistema',   descricao: 'Rotina automática da própria aplicação' }
  };

  /* Cada ação declara sua categoria e se é considerada sensível — as
   * sensíveis mudam indicadores já apurados e ganham destaque na tela. */
  var ACOES = {
    ESTADO_ALTERADO:        { rotulo: 'Estado alterado',        categoria: 'OPERACAO' },
    PARADA_INICIADA:        { rotulo: 'Parada iniciada',        categoria: 'PARADA' },
    PARADA_FINALIZADA:      { rotulo: 'Parada finalizada',      categoria: 'PARADA' },
    MOTIVO_RECLASSIFICADO:  { rotulo: 'Motivo reclassificado',  categoria: 'PARADA', sensivel: true },
    SETUP_INICIADO:         { rotulo: 'Setup iniciado',         categoria: 'OPERACAO' },
    SETUP_FINALIZADO:       { rotulo: 'Setup finalizado',       categoria: 'OPERACAO' },
    MANUTENCAO_SOLICITADA:  { rotulo: 'Manutenção solicitada',  categoria: 'OPERACAO' },
    OBSERVACAO_REGISTRADA:  { rotulo: 'Observação registrada',  categoria: 'OPERACAO' },
    SUGESTAO_ACEITA:        { rotulo: 'Sugestão do ACMP aceita',   categoria: 'OPERACAO' },
    SUGESTAO_IGNORADA:      { rotulo: 'Sugestão do ACMP ignorada', categoria: 'OPERACAO' },

    PRODUCAO_APONTADA:      { rotulo: 'Produção apontada',      categoria: 'PRODUCAO' },
    REFUGO_APONTADO:        { rotulo: 'Refugo apontado',        categoria: 'PRODUCAO', sensivel: true },
    RETRABALHO_APONTADO:    { rotulo: 'Retrabalho apontado',    categoria: 'PRODUCAO' },
    APONTAMENTO_RECUSADO:   { rotulo: 'Apontamento recusado',   categoria: 'PRODUCAO' },

    ORDEM_ABERTA:           { rotulo: 'Ordem aberta',           categoria: 'ORDEM' },
    ORDEM_FINALIZADA:       { rotulo: 'Ordem finalizada',       categoria: 'ORDEM' },

    REGISTRO_CRIADO:        { rotulo: 'Registro criado',        categoria: 'CADASTRO' },
    REGISTRO_ALTERADO:      { rotulo: 'Registro alterado',      categoria: 'CADASTRO', sensivel: true },
    REGISTRO_EXCLUIDO:      { rotulo: 'Registro excluído',      categoria: 'CADASTRO', sensivel: true },
    EXCLUSAO_BLOQUEADA:     { rotulo: 'Exclusão bloqueada',     categoria: 'CADASTRO' },

    METAS_ALTERADAS:        { rotulo: 'Metas alteradas',        categoria: 'CONFIGURACAO', sensivel: true },
    SIMULACAO_ALTERADA:     { rotulo: 'Simulação alterada',     categoria: 'CONFIGURACAO' },
    ACMP_ALTERADO:          { rotulo: 'Assistente ACMP alterado', categoria: 'CONFIGURACAO' },

    DADOS_EXPORTADOS:       { rotulo: 'Dados exportados',       categoria: 'DADOS' },
    DADOS_IMPORTADOS:       { rotulo: 'Dados importados',       categoria: 'DADOS', sensivel: true },
    DEMO_RESTAURADA:        { rotulo: 'Demonstração restaurada', categoria: 'DADOS', sensivel: true },
    HISTORICO_PODADO:       { rotulo: 'Histórico podado',       categoria: 'DADOS' },
    TRILHA_PODADA:          { rotulo: 'Trilha podada',          categoria: 'DADOS' },

    APLICACAO_INICIADA:     { rotulo: 'Aplicação iniciada',     categoria: 'SESSAO' },
    MODO_ALTERADO:          { rotulo: 'Modo alterado',          categoria: 'SESSAO' }
  };

  /* ---------------------------------------------------------------------
   * Hash FNV-1a de 32 bits. Escolhido por ser curto, determinístico e
   * implementável em poucas linhas sem depender de Web Crypto — que é
   * assíncrono e indisponível em contexto file://, justamente o caso do
   * iPad. Não é resistente a colisão proposital; ver ressalva no topo.
   * ------------------------------------------------------------------- */
  function hashTexto(texto) {
    var h = 0x811c9dc5;
    for (var i = 0; i < texto.length; i++) {
      h ^= texto.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('0000000' + h.toString(16)).slice(-8);
  }

  function estavel(valor) {
    if (valor === null || valor === undefined) return '';
    if (typeof valor !== 'object') return String(valor);
    /* Chaves ordenadas: a mesma informação sempre produz o mesmo hash,
       independentemente da ordem em que os campos foram montados. */
    return Object.keys(valor).sort().map(function (k) {
      return k + '=' + estavel(valor[k]);
    }).join(',');
  }

  function calcularHash(reg) {
    return hashTexto([
      reg.hashAnterior || 'inicio',
      reg.ts, reg.origem, reg.categoria, reg.acao,
      reg.usuario, reg.maquinaId || '', reg.ordemId || '',
      reg.entidade || '', reg.entidadeId || '',
      reg.descricao,
      estavel(reg.antes), estavel(reg.depois), estavel(reg.detalhes)
    ].join('|'));
  }

  /* ---------------------------------------------------------------------
   * Registro
   * ------------------------------------------------------------------- */
  function registrar(ds, ev) {
    if (!ds || !ev || !ev.acao) return null;
    if (!Array.isArray(ds.auditoria)) ds.auditoria = [];

    var def = ACOES[ev.acao] || {};
    var anterior = ds.auditoria[ds.auditoria.length - 1];

    var reg = {
      id: Model.novoId('AUD'),
      ts: ev.ts || Date.now(),
      origem: ev.origem || 'GESTAO',
      categoria: ev.categoria || def.categoria || 'SESSAO',
      acao: ev.acao,
      sensivel: !!def.sensivel,
      usuario: ev.usuario || 'não identificado',
      descricao: ev.descricao || def.rotulo || ev.acao,
      maquinaId: ev.maquinaId || null,
      ordemId: ev.ordemId || null,
      turnoId: ev.turnoId || null,
      operadorId: ev.operadorId || null,
      entidade: ev.entidade || null,
      entidadeId: ev.entidadeId || null,
      antes: ev.antes || null,
      depois: ev.depois || null,
      detalhes: ev.detalhes || null,
      hashAnterior: anterior ? anterior.hash : null
    };
    reg.hash = calcularHash(reg);

    ds.auditoria.push(reg);
    podar(ds);
    return reg;
  }

  /* A poda é ela própria auditada: sem esse registro, um intervalo em branco
   * na trilha seria indistinguível de apagamento deliberado. */
  function podar(ds) {
    if (ds.auditoria.length <= LIMITE) return;
    var removidos = ds.auditoria.splice(0, REMOVER_POR_VEZ);
    var marcador = {
      id: Model.novoId('AUD'),
      ts: Date.now(),
      origem: 'SISTEMA',
      categoria: 'DADOS',
      acao: 'TRILHA_PODADA',
      sensivel: false,
      usuario: 'sistema',
      descricao: removidos.length + ' registros antigos removidos da trilha por limite de armazenamento.',
      maquinaId: null, ordemId: null, turnoId: null, operadorId: null,
      entidade: 'auditoria', entidadeId: null,
      antes: null, depois: null,
      detalhes: {
        removidos: removidos.length,
        maisAntigoRemovido: removidos[0] ? removidos[0].ts : null,
        maisRecenteRemovido: removidos[removidos.length - 1] ? removidos[removidos.length - 1].ts : null,
        limite: LIMITE
      },
      hashAnterior: null
    };
    marcador.hash = calcularHash(marcador);
    ds.auditoria.unshift(marcador);
  }

  /* ---------------------------------------------------------------------
   * Comparação campo a campo — o coração de um "antes e depois" útil
   * ------------------------------------------------------------------- */
  function diferencas(antes, depois) {
    var lista = [];
    if (!antes && !depois) return lista;
    var chaves = {};
    Object.keys(antes || {}).forEach(function (k) { chaves[k] = true; });
    Object.keys(depois || {}).forEach(function (k) { chaves[k] = true; });

    Object.keys(chaves).forEach(function (k) {
      var de = antes ? antes[k] : undefined;
      var para = depois ? depois[k] : undefined;
      if (estavel(de) !== estavel(para)) lista.push({ campo: k, de: de, para: para });
    });
    return lista;
  }

  /* ---------------------------------------------------------------------
   * Verificação de integridade da corrente
   * ------------------------------------------------------------------- */
  function verificarIntegridade(ds) {
    var trilha = (ds && ds.auditoria) || [];
    var alterados = [];
    var quebras = [];

    for (var i = 0; i < trilha.length; i++) {
      var reg = trilha[i];
      /* Recalcula o hash com os valores atuais do registro. Diferente do
         gravado significa que algum campo foi editado depois do fato. */
      if (calcularHash(reg) !== reg.hash) alterados.push(reg);

      /* O elo com o registro anterior detecta remoção no meio da trilha. */
      if (i > 0) {
        var esperado = trilha[i - 1].hash;
        var truncadoLegitimo = trilha[i - 1].acao === 'TRILHA_PODADA' && reg.hashAnterior !== esperado;
        if (reg.hashAnterior !== esperado && !truncadoLegitimo) quebras.push(reg);
      }
    }
    return {
      total: trilha.length,
      alterados: alterados,
      quebras: quebras,
      integra: alterados.length === 0 && quebras.length === 0
    };
  }

  /* ---------------------------------------------------------------------
   * Consulta
   * ------------------------------------------------------------------- */
  function filtrar(ds, c) {
    var trilha = (ds && ds.auditoria) || [];
    c = c || {};
    var busca = (c.busca || '').trim().toLowerCase();

    return trilha.filter(function (r) {
      if (c.inicio && r.ts < c.inicio) return false;
      if (c.fim && r.ts > c.fim) return false;
      if (c.categoria && r.categoria !== c.categoria) return false;
      if (c.origem && r.origem !== c.origem) return false;
      if (c.acao && r.acao !== c.acao) return false;
      if (c.operadorId && r.operadorId !== c.operadorId) return false;
      if (c.turnoId && r.turnoId !== c.turnoId) return false;
      if (c.ordemId && r.ordemId !== c.ordemId) return false;
      /* Registros sem máquina (configuração, importação) são de escopo geral
         e continuam visíveis mesmo com uma máquina filtrada — omiti-los
         esconderia justamente as ações de maior impacto. */
      if (c.maquinaIds && r.maquinaId && c.maquinaIds.indexOf(r.maquinaId) < 0) return false;
      if (busca) {
        var alvo = [r.descricao, r.usuario, r.entidadeId, r.entidade,
          estavel(r.antes), estavel(r.depois), estavel(r.detalhes)].join(' ').toLowerCase();
        if (alvo.indexOf(busca) < 0) return false;
      }
      return true;
    });
  }

  function resumo(registros) {
    var porCategoria = {}, porOrigem = {}, sensiveis = 0, usuarios = {};
    registros.forEach(function (r) {
      porCategoria[r.categoria] = (porCategoria[r.categoria] || 0) + 1;
      porOrigem[r.origem] = (porOrigem[r.origem] || 0) + 1;
      usuarios[r.usuario] = true;
      if (r.sensivel) sensiveis += 1;
    });
    return {
      total: registros.length,
      sensiveis: sensiveis,
      usuarios: Object.keys(usuarios).length,
      porCategoria: porCategoria,
      porOrigem: porOrigem,
      primeiro: registros.length ? registros[0].ts : null,
      ultimo: registros.length ? registros[registros.length - 1].ts : null
    };
  }

  OEE.Audit = {
    CATEGORIAS: CATEGORIAS,
    ORIGENS: ORIGENS,
    ACOES: ACOES,
    LIMITE: LIMITE,
    registrar: registrar,
    filtrar: filtrar,
    resumo: resumo,
    diferencas: diferencas,
    verificarIntegridade: verificarIntegridade,
    hashTexto: hashTexto
  };
})(window);

  </script>
